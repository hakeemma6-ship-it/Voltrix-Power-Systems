# Voltrix Power Systems - Production Reverse Proxy & Nginx Server Config
server {
    listen 80;
    listen [::]:80;
    server_name voltrixpower.com www.voltrixpower.com;

    # Redirect all HTTP traffic to HTTPS securely
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voltrixpower.com www.voltrixpower.com;

    # SSL Certificates Configuration (Let's Encrypt default path)
    ssl_certificate /etc/letsencrypt/live/voltrixpower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltrixpower.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/voltrixpower.com/chain.pem;

    # SSL Parameters for high-grade security (A+ rating configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security) - 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-src 'self'; connect-src 'self' wss: https:;" always;

    # Reverse Proxy to local Next.js node application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Connection upgrades for Event Streams (SSE / WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for keeping long-lived SSE / stream connections active
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Gzip compression configuration
        gzip on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;
    }

    # Static Assets caching rules (Next.js static assets)
    location /_next/static/ {
        alias /var/www/voltrix-power-systems/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files caching
    location /public/ {
        alias /var/www/voltrix-power-systems/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }
}
